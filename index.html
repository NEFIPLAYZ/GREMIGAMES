<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="LPYvnjA0lW83tgggnn_tD-k-fN0q0d51TXIMNje5tJ0">

  <!-- Website Title and SEO -->
  <title>GREMIGAMES - Play Free Online Games</title>
  <meta name="description" content="Play shooting, action, racing and arcade games on GREMIGAMES. Discover exciting games online for free.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#101116">

  <!-- Fullscreen when added to home screen (PWA) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22GREMIGAMES%22%2C%22short_name%22%3A%22GREMIGAMES%22%2C%22display%22%3A%22fullscreen%22%2C%22orientation%22%3A%22any%22%2C%22background_color%22%3A%22%23101116%22%2C%22theme_color%22%3A%22%23101116%22%7D">

  <!-- Website Icon / Favicon -->
  <link rel="icon" type="image/png" sizes="1000x1000" href="./icon.png">
  <link rel="shortcut icon" href="./icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon.png">

  <!-- Open Graph: WhatsApp, Facebook and Discord -->
  <meta property="og:site_name" content="GREMIGAMES">
  <meta property="og:title" content="GREMIGAMES - Play Free Online Games">
  <meta property="og:description" content="Play shooting, action, racing and arcade games on GREMIGAMES.">
  <meta property="og:url" content="https://nefiplayz.github.io/gremigames/">
  <meta property="og:image" content="https://nefiplayz.github.io/gremigames/icon.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:type" content="website">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="GREMIGAMES - Play Free Online Games">
  <meta name="twitter:description" content="Play shooting, action, racing and arcade games on GREMIGAMES.">
  <meta name="twitter:image" content="https://nefiplayz.github.io/gremigames/icon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: #101116;
      color: #ffffff;
      font-family: Arial, sans-serif;
      overscroll-behavior: none;
    }

    body.player-open,
    html.player-open {
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    header {
      background: #181920;
      padding: 14px 20px;
      border-bottom: 2px solid #292a35;
    }

    .header-container {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      color: #ffffff;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .logo span {
      color: #ff4545;
    }

    .search-box {
      width: 100%;
      max-width: 320px;
      padding: 10px 14px;
      border: 1px solid #333542;
      border-radius: 8px;
      background: #1b1c25;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .search-box:focus {
      border-color: #ff4545;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 15px 10px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-top: 10px;
      margin-bottom: 8px;
    }

    .category-btn {
      flex-shrink: 0;
      padding: 10px 13px;
      border: 1px solid #343541;
      border-radius: 8px;
      background: #1b1c25;
      color: #ffffff;
      font-size: 13px;
      cursor: pointer;
    }

    .category-btn.active,
    .category-btn:hover {
      background: #ff4545;
      border-color: #ff4545;
    }

    .section-title {
      font-size: 19px;
      margin: 12px 0;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .game-card {
      min-width: 0;
      overflow: hidden;
      border-radius: 10px;
      background: #1b1c25;
      border: 1px solid #292a35;
      color: white;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .game-card:active {
      transform: scale(0.97);
    }

    .game-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #292a35;
    }

    .game-name {
      padding: 9px 5px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .message {
      grid-column: 1 / -1;
      text-align: center;
      color: #bbbbc5;
      padding: 30px 10px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 25px 10px;
      color: #888995;
      font-size: 12px;
    }

    /* Game Player - full screen, no header, no title, no help text */
    .game-player {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 9999;
      background: #000;
      flex-direction: column;
      overflow: hidden;
    }

    .game-player.open {
      display: flex;
    }

    .player-frame-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #000;
    }

    .player-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    /* Small floating close button so the game can still be exited */
    .player-close {
      position: absolute;
      top: calc(10px + env(safe-area-inset-top, 0px));
      right: calc(10px + env(safe-area-inset-right, 0px));
      z-index: 10;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 69, 69, 0.85);
      color: #ffffff;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .player-close:active {
      background: #ff4545;
    }

    @media (max-width: 480px) {
      .header-container {
        flex-wrap: wrap;
      }

      .logo {
        font-size: 20px;
      }

      .search-box {
        max-width: none;
        flex: 1;
        min-width: 120px;
        padding: 8px 10px;
        font-size: 13px;
      }
    }

    @media (min-width: 700px) {
      .games-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .game-name {
        font-size: 15px;
        padding: 12px;
      }

      .container {
        padding: 22px 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-container">
      <div class="logo">GREMI<span>GAMES</span></div>

      <input
        type="search"
        id="searchInput"
        class="search-box"
        placeholder="Search Game"
        aria-label="Search Game"
      >
    </div>
  </header>

  <main class="container">

    <nav class="categories" aria-label="Game categories">

      <button class="category-btn active" data-category="All Games" type="button">
        All Games
      </button>

      <button class="category-btn" data-category="Shooting" type="button">
        Shooting
      </button>

      <button class="category-btn" data-category="Action" type="button">
        Action
      </button>

      <button class="category-btn" data-category="Racing" type="button">
        Racing
      </button>

      <button class="category-btn" data-category="Arcade" type="button">
        Arcade
      </button>

      <button class="category-btn" data-category="GREMIGAMES Originals" type="button">
        GREMIGAMES Originals
      </button>

    </nav>

    <h2 class="section-title">All Games</h2>

    <section id="gamesGrid" class="games-grid">
      <p class="message">Loading games...</p>
    </section>

  </main>

  <footer>
    &copy; <span id="year"></span> GREMIGAMES. All rights reserved.
  </footer>

  <!-- Game Player: no title bar, no "Open Link" button, no help text -->
  <section
    id="gamePlayer"
    class="game-player"
    role="dialog"
    aria-modal="true"
    aria-label="Game player"
  >

    <div class="player-frame-wrap">

      <iframe
        id="gameFrame"
        class="player-frame"
        src="about:blank"
        title="Game"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>

    </div>

    <button
      id="closeGameBtn"
      class="player-close"
      type="button"
      aria-label="Close game"
    >
      &#10005;
    </button>

  </section>

  <script>
    const gamesGrid = document.getElementById("gamesGrid");
    const searchInput = document.getElementById("searchInput");
    const sectionTitle = document.querySelector(".section-title");
    const categoryButtons = document.querySelectorAll(".category-btn");

    const gamePlayer = document.getElementById("gamePlayer");
    const gameFrame = document.getElementById("gameFrame");
    const closeGameBtn = document.getElementById("closeGameBtn");

    let games = [];
    let activeCategory = "All Games";
    let currentGameLink = "";

    document.getElementById("year").textContent =
      new Date().getFullYear();

    async function loadGames() {
      try {
        const response = await fetch("./games.json");

        if (!response.ok) {
          throw new Error("Could not load games.json");
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("games.json must contain a JSON array");
        }

        games = data.filter(game =>
          game &&
          typeof game.name === "string" &&
          typeof game.link === "string" &&
          typeof game.image === "string" &&
          typeof game.category === "string"
        );

        renderGames();

      } catch (error) {
        console.error("Game loading error:", error);

        gamesGrid.innerHTML = `
          <p class="message">
            Games load nahi ho sake.<br>
            Check karein ke index.html aur games.json
            ek hi folder mein hain aur website hosting par chal rahi hai.
          </p>
        `;
      }
    }

    function requestFullscreenOn(el) {
      const fn =
        el.requestFullscreen ||
        el.webkitRequestFullscreen ||
        el.mozRequestFullScreen ||
        el.msRequestFullscreen;

      if (!fn) {
        return Promise.reject(new Error("Fullscreen not supported"));
      }

      try {
        // Call WITHOUT arguments for maximum browser compatibility.
        // Some WebKit/WebView builds throw when options are passed.
        const result = fn.call(el);
        return result && result.then ? result : Promise.resolve();
      } catch (error) {
        return Promise.reject(error);
      }
    }

    function enterFullscreen() {
      // First try the player element, then fall back to the whole page.
      requestFullscreenOn(gamePlayer)
        .catch(() => requestFullscreenOn(document.documentElement))
        .catch(() => {});
    }

    function exitFullscreen() {
      const fn =
        document.exitFullscreen ||
        document.webkitExitFullscreen ||
        document.mozCancelFullScreen ||
        document.msExitFullscreen;

      if (fn && (document.fullscreenElement ||
        document.webkitFullscreenElement)) {
        try {
          const result = fn.call(document);
          if (result && result.catch) {
            result.catch(() => {});
          }
        } catch (error) {
          /* ignore */
        }
      }
    }

    function openGame(game) {
      let url;

      try {
        url = new URL(game.link, window.location.href);

        if (!["https:", "http:"].includes(url.protocol)) {
          alert("Is game link ka format valid nahi hai.");
          return;
        }

      } catch (error) {
        alert("Game link valid nahi hai.");
        return;
      }

      currentGameLink = url.href;
      gameFrame.title = game.name;

      gamePlayer.classList.add("open");
      document.body.classList.add("player-open");
      document.documentElement.classList.add("player-open");

      // Add a history entry so the phone's Back button closes the game
      // instead of leaving the page (leaving is what shows a URL).
      if (!history.state || !history.state.gameOpen) {
        history.pushState({ gameOpen: true }, "", location.href);
      }

      // Ask for fullscreen FIRST, while the tap is still "fresh"
      // (some browsers reject the request if anything runs in between).
      enterFullscreen();

      gameFrame.src = currentGameLink;

      closeGameBtn.focus();
    }

    // Some mobile browsers only allow fullscreen on a fresh tap.
    // If we are not in fullscreen yet, a tap inside the player retries it.
    gamePlayer.addEventListener("pointerdown", event => {
      if (event.target.closest && event.target.closest(".player-close")) {
        return;
      }

      if (
        gamePlayer.classList.contains("open") &&
        !document.fullscreenElement &&
        !document.webkitFullscreenElement
      ) {
        enterFullscreen();
      }
    });

    function closeGame(fromHistory) {
      if (!gamePlayer.classList.contains("open")) {
        return;
      }

      gamePlayer.classList.remove("open");
      document.body.classList.remove("player-open");
      document.documentElement.classList.remove("player-open");

      gameFrame.src = "about:blank";
      currentGameLink = "";

      exitFullscreen();

      // Remove the history entry we added when the game opened.
      if (!fromHistory && history.state && history.state.gameOpen) {
        history.back();
      }
    }

    // Phone Back button / swipe-back while a game is open.
    window.addEventListener("popstate", () => {
      if (gamePlayer.classList.contains("open")) {
        closeGame(true);
      }
    });

    closeGameBtn.addEventListener("click", () => closeGame(false));

    document.addEventListener("keydown", event => {
      if (
        event.key === "Escape" &&
        gamePlayer.classList.contains("open") &&
        !document.fullscreenElement &&
        !document.webkitFullscreenElement
      ) {
        closeGame();
      }
    });

    // If the user leaves fullscreen (swipe/back), close the game so the
    // browser's URL bar never sits on top of a running game.
    let fullscreenExitTimer = null;

    function handleFullscreenChange() {
      clearTimeout(fullscreenExitTimer);

      const isFullscreen =
        document.fullscreenElement || document.webkitFullscreenElement;

      if (isFullscreen) {
        if (gamePlayer.classList.contains("open")) {
          document.body.classList.add("player-open");
        }
        return;
      }

      // We just left fullscreen - wait a moment, then close if still out.
      fullscreenExitTimer = setTimeout(() => {
        if (
          gamePlayer.classList.contains("open") &&
          !document.fullscreenElement &&
          !document.webkitFullscreenElement
        ) {
          closeGame(false);
        }
      }, 400);
    }

    document.addEventListener("fullscreenchange", handleFullscreenChange);
    document.addEventListener("webkitfullscreenchange", handleFullscreenChange);

    function renderGames() {
      const searchText = searchInput.value.trim().toLowerCase();

      const filteredGames = games.filter(game => {
        const matchesSearch =
          game.name.toLowerCase().includes(searchText);

        const matchesCategory =
          activeCategory === "All Games" ||
          game.category.toLowerCase() === activeCategory.toLowerCase();

        return matchesSearch && matchesCategory;
      });

      sectionTitle.textContent = activeCategory;

      if (filteredGames.length === 0) {
        gamesGrid.innerHTML = `
          <p class="message">No games found.</p>
        `;
        return;
      }

      gamesGrid.innerHTML = "";

      filteredGames.forEach(game => {
        const card = document.createElement("a");

        card.className = "game-card";
        card.href = game.link;
        card.setAttribute("aria-label", "Play " + game.name);

        card.addEventListener("click", event => {
          event.preventDefault();
          openGame(game);
        });

        const image = document.createElement("img");

        image.src = game.image;
        image.alt = game.name;
        image.loading = "lazy";

        image.onerror = function() {
          this.onerror = null;
          this.src =
            "https://placehold.co/300x300/20202b/ffffff?text=Game";
        };

        const name = document.createElement("div");

        name.className = "game-name";
        name.textContent = game.name;

        card.appendChild(image);
        card.appendChild(name);

        gamesGrid.appendChild(card);
      });
    }

    searchInput.addEventListener("input", renderGames);

    categoryButtons.forEach(button => {
      button.addEventListener("click", () => {

        categoryButtons.forEach(item => {
          item.classList.remove("active");
        });

        button.classList.add("active");

        activeCategory = button.dataset.category;

        renderGames();
      });
    });

    loadGames();
  </script>

</body>
      </html>
