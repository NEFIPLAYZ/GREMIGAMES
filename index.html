<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GREMIGAMES</title>
  <meta name="description" content="Play shooting, action, racing and arcade games on GREMIGAMES.">

  <!-- ===== Link preview (Discord / WhatsApp / Twitter / Facebook) ===== -->
  <!-- Ye tags hi decide karte hain ki link share karne par naam aur image kaise dikhe -->

  <!-- Site ka chhota naam (upar wala bold text) -->
  <meta property="og:site_name" content="GREMIGAMES">

  <!-- Bada heading / title -->
  <meta property="og:title" content="GREMI GAMES">

  <!-- Neeche aane wali description -->
  <meta property="og:description" content="Play shooting, action, racing and arcade games on GREMIGAMES.">

  <!-- Aapki site ka POORA (absolute) URL -->
  <meta property="og:url" content="https://nefiplayz.github.io/gremigames/">

  <!-- Preview mein dikhne wali image (absolute URL zaroori hai) -->
  <meta property="og:image" content="https://nefiplayz.github.io/gremigames/icon.png">

  <meta property="og:type" content="website">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GREMI GAMES">
  <meta name="twitter:description" content="Play shooting, action, racing and arcade games on GREMIGAMES.">
  <meta name="twitter:image" content="https://nefiplayz.github.io/gremigames/icon.png">

  <!-- Browser tab ka icon -->
  <link rel="icon" href="icon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101116;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    body.player-open {
      overflow: hidden;
    }

    header {
      background: #181920;
      padding: 14px 20px;
      border-bottom: 2px solid #292a35;
    }

    .header-container {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      color: #ffffff;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .logo span {
      color: #ff4545;
    }

    .search-box {
      width: 100%;
      max-width: 320px;
      padding: 10px 14px;
      border: 1px solid #333542;
      border-radius: 8px;
      background: #1b1c25;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .search-box:focus {
      border-color: #ff4545;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 15px 10px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-top: 10px;
      margin-bottom: 8px;
    }

    .category-btn {
      flex-shrink: 0;
      padding: 10px 13px;
      border: 1px solid #343541;
      border-radius: 8px;
      background: #1b1c25;
      color: #ffffff;
      font-size: 13px;
      cursor: pointer;
    }

    .category-btn.active,
    .category-btn:hover {
      background: #ff4545;
      border-color: #ff4545;
    }

    .section-title {
      font-size: 19px;
      margin: 12px 0;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .game-card {
      min-width: 0;
      overflow: hidden;
      border-radius: 10px;
      background: #1b1c25;
      border: 1px solid #292a35;
      color: white;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .game-card:active {
      transform: scale(0.97);
    }

    .game-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #292a35;
    }

    .game-name {
      padding: 9px 5px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .message {
      grid-column: 1 / -1;
      text-align: center;
      color: #bbbbc5;
      padding: 30px 10px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 25px 10px;
      color: #888995;
      font-size: 12px;
    }

    /* Game player overlay */
    .game-player {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #101116;
      flex-direction: column;
    }

    .game-player.open {
      display: flex;
    }

    .player-header {
      min-height: 58px;
      padding: 10px 14px;
      background: #181920;
      border-bottom: 1px solid #30313d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .player-title {
      min-width: 0;
      font-size: 16px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .player-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .player-btn {
      border: 0;
      border-radius: 7px;
      padding: 10px 12px;
      background: #ff4545;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    .player-btn.secondary {
      background: #30313d;
    }

    .player-frame-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #000;
    }

    .player-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .player-help {
      padding: 8px 12px;
      background: #181920;
      color: #bfc0cb;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .logo {
        font-size: 20px;
      }

      .search-box {
        max-width: 180px;
        padding: 8px 10px;
        font-size: 13px;
      }

      .player-header {
        padding: 9px;
      }

      .player-title {
        font-size: 14px;
      }

      .player-btn {
        padding: 10px;
        font-size: 12px;
      }
    }

    @media (min-width: 700px) {
      .games-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .game-name {
        font-size: 15px;
        padding: 12px;
      }

      .container {
        padding: 22px 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-container">
      <div class="logo">GREMI<span>GAMES</span></div>

      <input
        type="search"
        id="searchInput"
        class="search-box"
        placeholder="Search Game"
        aria-label="Search Game"
      >
    </div>
  </header>

  <main class="container">

    <nav class="categories" aria-label="Game categories">
      <button class="category-btn active" data-category="All Games">All Games</button>
      <button class="category-btn" data-category="Shooting">Shooting</button>
      <button class="category-btn" data-category="Action">Action</button>
      <button class="category-btn" data-category="Racing">Racing</button>
      <button class="category-btn" data-category="Arcade">Arcade</button>
      <button class="category-btn" data-category="GREMIGAMES Originals">GREMIGAMES Originals</button>
    </nav>

    <h2 class="section-title">All Games</h2>

    <section id="gamesGrid" class="games-grid">
      <p class="message">Loading games...</p>
    </section>

  </main>

  <footer>
    © <span id="year"></span> GREMIGAMES
  </footer>

  <!-- In-website game player -->
  <section
    id="gamePlayer"
    class="game-player"
    role="dialog"
    aria-modal="true"
    aria-label="Game player"
  >
    <div class="player-header">
      <div id="playerTitle" class="player-title">Game</div>

      <div class="player-actions">
        <button id="openExternalBtn" class="player-btn secondary" type="button">
          Open Link
        </button>

        <button id="closeGameBtn" class="player-btn" type="button">
          Close
        </button>
      </div>
    </div>

    <div class="player-frame-wrap">
      <iframe
        id="gameFrame"
        class="player-frame"
        src="about:blank"
        title="Game"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>

    <div class="player-help">
      Agar game load na ho, to ho sakta hai game ki website embedding block karti ho.
    </div>
  </section>

  <script>
    const gamesGrid = document.getElementById("gamesGrid");
    const searchInput = document.getElementById("searchInput");
    const sectionTitle = document.querySelector(".section-title");
    const categoryButtons = document.querySelectorAll(".category-btn");

    const gamePlayer = document.getElementById("gamePlayer");
    const gameFrame = document.getElementById("gameFrame");
    const playerTitle = document.getElementById("playerTitle");
    const closeGameBtn = document.getElementById("closeGameBtn");
    const openExternalBtn = document.getElementById("openExternalBtn");

    let games = [];
    let activeCategory = "All Games";
    let currentGameLink = "";

    document.getElementById("year").textContent =
      new Date().getFullYear();

    async function loadGames() {
      try {
        const response = await fetch("./games.json");

        if (!response.ok) {
          throw new Error("Could not load games.json");
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("games.json must contain a JSON array");
        }

        games = data.filter(game =>
          game &&
          typeof game.name === "string" &&
          typeof game.link === "string" &&
          typeof game.image === "string" &&
          typeof game.category === "string"
        );

        renderGames();

      } catch (error) {
        console.error("Game loading error:", error);

        gamesGrid.innerHTML = `
          <p class="message">
            Games load nahi ho sake.<br>
            Check karein ke index.html aur games.json
            ek hi folder mein hain aur website hosting par chal rahi hai.
          </p>
        `;
      }
    }

    /**
     * @param {{ name: string, link: string, image: string, category: string }} game
     */
    function openGame(game) {
      let url;

      try {
        url = new URL(game.link, window.location.href);

        if (!["https:", "http:"].includes(url.protocol)) {
          alert("Is game link ka format valid nahi hai.");
          return;
        }
      } catch (error) {
        alert("Game link valid nahi hai.");
        return;
      }

      currentGameLink = url.href;
      playerTitle.textContent = game.name;
      gameFrame.title = game.name;

      gamePlayer.classList.add("open");
      document.body.classList.add("player-open");

      gameFrame.src = currentGameLink;
    }

    function closeGame() {
      gamePlayer.classList.remove("open");
      document.body.classList.remove("player-open");

      gameFrame.src = "about:blank";
      currentGameLink = "";
    }

    closeGameBtn.addEventListener("click", closeGame);

    openExternalBtn.addEventListener("click", () => {
      if (currentGameLink) {
        window.open(currentGameLink, "_blank", "noopener,noreferrer");
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && gamePlayer.classList.contains("open")) {
        closeGame();
      }
    });

    function renderGames() {
      const searchText = searchInput.value.trim().toLowerCase();

      const filteredGames = games.filter(game => {
        const matchesSearch =
          game.name.toLowerCase().includes(searchText);

        const matchesCategory =
          activeCategory === "All Games" ||
          game.category.toLowerCase() === activeCategory.toLowerCase();

        return matchesSearch && matchesCategory;
      });

      sectionTitle.textContent = activeCategory;

      if (filteredGames.length === 0) {
        gamesGrid.innerHTML = `
          <p class="message">No games found.</p>
        `;
        return;
      }

      gamesGrid.innerHTML = "";

      filteredGames.forEach(game => {
        const card = document.createElement("a");

        card.className = "game-card";
        card.href = game.link;
        card.setAttribute("aria-label", "Play " + game.name);

        card.addEventListener("click", event => {
          event.preventDefault();
          openGame(game);
        });

        const image = document.createElement("img");
        image.src = game.image;
        image.alt = game.name;
        image.loading = "lazy";

        image.onerror = function() {
          this.onerror = null;
          this.src =
            "https://placehold.co/300x300/20202b/ffffff?text=Game";
        };

        const name = document.createElement("div");
        name.className = "game-name";
        name.textContent = game.name;

        card.appendChild(image);
        card.appendChild(name);

        gamesGrid.appendChild(card);
      });
    }

    searchInput.addEventListener("input", renderGames);

    categoryButtons.forEach(button => {
      button.addEventListener("click", () => {
        categoryButtons.forEach(item =>
          item.classList.remove("active")
        );

        button.classList.add("active");
        activeCategory = button.dataset.category;

        renderGames();
      });
    });

    loadGames();
  </script>

</body>
    </html>
